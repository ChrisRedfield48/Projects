<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>projects.js — NIP.SYS</title>
  <meta name="description" content="Портфолио JavaScript-проектов как исходный код. NIP.SYS · Chris.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0c0a">
  <link rel="icon" href="Unofficial_JavaScript_logo_2.svg.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="ide">
    <div class="titlebar">
      <div class="tb-left">
        <div class="dots" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>
        <span class="winpath"><span class="wp-dim">~/nip.sys/</span><span id="winfile">projects.js</span></span>
      </div>
      <div class="tb-right">
        <img class="brand-logo" src="Unofficial_JavaScript_logo_2.svg.png" alt="JavaScript" width="26" height="26">
        <button id="theme-toggle" class="theme" type="button" aria-label="Переключить тему">
          <span class="theme-ic">◑</span><span id="theme-label">light</span>
        </button>
      </div>
    </div>

    <div class="workspace">
      <aside class="sidebar">
        <div class="side-h">Explorer</div>
        <div class="tree">
          <div class="folder" aria-hidden="true"><span class="fold-ic">▾</span> NIP.SYS</div>
          <button class="file active" data-file="projects" type="button"><span class="fic">{}</span>projects.js</button>
          <button class="file" data-file="about" type="button"><span class="fic">{}</span>about.js</button>
          <button class="file" data-file="contact" type="button"><span class="fic">{}</span>contact.js</button>
          <a class="file ext" href="https://github.com/ChrisRedfield48" target="_blank" rel="noopener noreferrer"><span class="fic">↗</span>github</a>
        </div>
        <div class="side-foot">© 2026 · Chris<br><span class="sf-dim">Россия → Белград</span></div>
      </aside>

      <div class="main">
        <div class="tabs" id="tabs">
          <button class="tab active" data-file="projects" type="button">projects.js<span class="tab-x" aria-hidden="true">●</span></button>
          <button class="tab" data-file="about" type="button">about.js<span class="tab-x" aria-hidden="true">●</span></button>
          <button class="tab" data-file="contact" type="button">contact.js<span class="tab-x" aria-hidden="true">●</span></button>
        </div>
        <div class="editor" id="editor" tabindex="0"></div>
      </div>
    </div>

    <div class="statusbar">
      <div class="st-left">
        <span class="branch"><span aria-hidden="true">⎇</span> main</span>
        <span id="st-info">6 live · 3 wip</span>
      </div>
      <div class="st-right">
        <span id="st-ln">Ln 1, Col 1</span>
        <span class="st-sep">UTF-8</span>
        <span class="st-sep">LF</span>
        <span class="st-lang">JavaScript</span>
      </div>
    </div>
  </div>

  <script src="js.js"></script>
</body>
</html>
